[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "retailiq"
version = "1.0.0"
description = "RetailIQ - enterprise agentic RAG platform for retail operations knowledge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayush", email = "heyayush0709@gmail.com" }]
keywords = ["rag", "langgraph", "agent", "retail", "llm", "retrieval", "self-rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime core only. Provider SDKs live in extras so a deployment installs
# exactly what it uses and nothing more.
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-chroma>=0.1.4",
    "chromadb>=0.5.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2.0"]
groq = ["langchain-groq>=0.2.0"]
google = ["langchain-google-genai>=2.0"]
ollama = ["langchain-ollama>=0.2.0"]
local = ["langchain-huggingface>=0.1.0", "sentence-transformers>=3.0.0"]
search = ["duckduckgo-search>=6.0.0"]
api = ["fastapi>=0.111.0", "uvicorn[standard]>=0.30.0"]
ui = ["streamlit>=1.36.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
# The default runnable stack: free Groq chat + free on-device embeddings.
all = ["retailiq[groq,local,search,api,ui]"]

[project.scripts]
retailiq = "retailiq.cli.main:app"

[project.urls]
Source = "https://github.com/heyayush87/Agentic-Rag"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/retailiq"]

[tool.hatch.build.targets.sdist]
include = ["src/retailiq", "data", "tests", "README.md"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "TID", "RUF"]
ignore = [
    "E501",   # line length is the formatter's job
    "B008",   # FastAPI Depends() in argument defaults is idiomatic
    "RUF001", # typographic arrows (→, ›) are deliberate in traces and prompts
    "RUF002",
    "RUF003",
    "BLE001", # broad excepts are deliberate: tool and grader failures must degrade, not crash
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["retailiq"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["src/retailiq"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

# Third-party LLM / vector packages ship partial or no type stubs.
[[tool.mypy.overrides]]
module = [
    "langchain.*", "langchain_core.*", "langchain_community.*",
    "langchain_chroma.*", "langchain_huggingface.*", "langchain_openai.*",
    "langchain_groq.*", "langchain_google_genai.*", "langchain_ollama.*",
    "langchain_text_splitters.*", "langgraph.*", "chromadb.*",
    "duckduckgo_search.*", "streamlit.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "unit: fast, fully offline (no network, no LLM calls)",
    "integration: real components wired together, still offline via fakes",
    "e2e: hits a live LLM provider; skipped unless a key is configured",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/retailiq"]
branch = true
omit = ["*/ui/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
